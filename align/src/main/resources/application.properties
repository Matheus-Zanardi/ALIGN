spring.application.name=align

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/align}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:align-local-development-secret-key-2026-secure}
jwt.expiration=86400000